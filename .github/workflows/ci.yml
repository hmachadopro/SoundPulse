name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # -m "not integration" : les tests d'intégration appellent S3 avec de
      # vrais credentials AWS, absents de ce job (contrairement à
      # terraform-plan ci-dessous) — les exclure ici évite un échec CI
      # systématique plutôt qu'un vrai signal de régression.
      - run: pytest tests/ -v -m "not integration"

  terraform-plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # requis pour l'auth OIDC vers AWS (pas de clés statiques)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
      - run: terraform -chdir=terraform init
      - run: terraform -chdir=terraform plan
